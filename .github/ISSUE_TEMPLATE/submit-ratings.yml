name: 提交评分 / Submit ratings
description: 把你在碧翠子禁书库里打的星级交给社区评分 / Add your star ratings to the community average
title: "提交评分 / Submit ratings"
labels: ["ratings"]
body:
  - type: markdown
    attributes:
      value: |
        **收什么：**只收每部作品的星级（作品 id → 1–5 星），没有名字、评论、想玩 / 玩过这些标记。
        汇总后作为社区评分（平均星级和人数）随数据包公开发布，授权是 [ODbL 1.0](https://opendatacommons.org/licenses/odbl/1-0/)；仓库里只放汇总结果，不放单份提交。
        **一个 GitHub 账号算一份：**再提交一次，新的会顶掉旧的。

        **怎么交：**在软件里导出「提交用的评分」文件（`kind` 是 `beatrice-ratings-submission`），用记事本打开，把全部内容粘贴到下面的框里。
        这里只能粘贴，不能拖文件进来。软件普通导出的评分文件也能用，但里面有你的名字和评论，贴在这里会公开，所以请用提交用的文件。

        ---

        **What is collected:** only your star rating per work (work id → 1–5 stars). No name, no notes, no want / played marks.
        Ratings are aggregated into a public community score (average stars and number of raters) that ships in the data packs under [ODbL 1.0](https://opendatacommons.org/licenses/odbl/1-0/). Only the aggregate is published in this repository, never individual submissions.
        **One submission per GitHub account:** if you submit again, the newer one replaces the older one.

        **How:** export the ratings-submission file from the app (`kind` is `beatrice-ratings-submission`), open it in a text editor and paste all of it into the box below.
        This box takes pasted text only, not file uploads. A normal ratings export also works, but it contains your name and notes, which would become public here, so please use the submission file.
  - type: textarea
    id: ratings
    attributes:
      label: 评分文件内容 / Ratings file contents
      description: 粘贴整个文件，不要改。/ Paste the whole file, unchanged.
      placeholder: '{"kind": "beatrice-ratings-submission", "version": 1, "app": "…", "catalog": "…", "ratings": {"RJ01004084": 5}}'
      render: json
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 同意 / Consent
      options:
        - label: 我同意把这些星级按 ODbL 1.0 汇总成公开的社区评分。/ I agree that these star ratings are aggregated into public community scores under ODbL 1.0.
          required: true
